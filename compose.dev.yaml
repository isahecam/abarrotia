services:
  database:
    container_name: abarrotia_dev
    image: postgres:17.10-alpine3.24
    ports:
      - "5432:5432"
    volumes:
      - abarrotia-data:/var/lib/postgresql/data
    # environment:
    #   POSTGRES_USER: ${POSTGRES_USER}
    #   POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    #   POSTGRES_DB: ${POSTGRES_DB}
    env_file:
      - .env.development
  pgAdmin:
    image: dpage/pgadmin4:9.16
    depends_on:
      - database
    ports:
      - "8080:80"
    # environment:
    #   PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
    #   PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    env_file:
      - .env.development

volumes:
  abarrotia-data:
    external: true
